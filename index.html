<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>SkillUp</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080c16;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px 16px 35px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.logo {
  font-size: 29px;
  font-weight: 900;
}

.logo span {
  color: #6d7cff;
}

.profile {
  background: #171e32;
  padding: 9px 15px;
  border-radius: 18px;
  font-weight: 700;
}

.hero {
  background: linear-gradient(145deg, #151d36, #101628);
  border-radius: 25px;
  padding: 22px;
  margin-bottom: 18px;
  border: 1px solid #252f4c;
}

.hero-title {
  color: #8d9cff;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
}

.hero-level {
  font-size: 42px;
  font-weight: 900;
  margin-top: 4px;
}

.hero-text {
  color: #9ba6bd;
  margin-top: 3px;
}

.card {
  background: #12192a;
  border: 1px solid #202a43;
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 14px;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.skill-name {
  font-size: 18px;
  font-weight: 800;
}

.level {
  background: #222c49;
  padding: 6px 11px;
  border-radius: 12px;
  font-weight: 800;
}

.xp-text {
  color: #8e9ab2;
  font-size: 13px;
  margin: 12px 0 7px;
}

.xp-bar {
  height: 8px;
  background: #252e45;
  border-radius: 20px;
  overflow: hidden;
}

.xp-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #6575ff, #9a7cff);
  transition: width .3s;
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

button {
  border: 0;
  border-radius: 13px;
  padding: 10px 14px;
  font-size: 15px;
  font-weight: 800;
  color: white;
  background: #242e4b;
}

button:active {
  transform: scale(.95);
}

.plus {
  background: #5968e8;
}

.minus {
  background: #30394f;
}

.average {
  margin-top: 20px;
}

.average-title {
  font-weight: 800;
  margin-bottom: 13px;
}

.average-row {
  display: flex;
  justify-content: space-between;
  padding: 11px 0;
  border-bottom: 1px solid #252e43;
  color: #aab4c8;
}

.average-row:last-child {
  border-bottom: 0;
}

.average-level {
  color: white;
  font-weight: 800;
}

.reset {
  width: 100%;
  margin-top: 8px;
  background: #191f30;
  color: #9ca8bd;
}

.footer {
  text-align: center;
  color: #59647a;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">Skill<span>Up</span></div>
    <div class="profile">👤 Shoh</div>
  </div>

  <div class="hero">
    <div class="hero-title">PLAYER PROFILE</div>
    <div class="hero-level">Уровень <span id="overall">1</span></div>
    <div class="hero-text">Развивай навыки и повышай свой уровень</div>
  </div>

  <div id="skills"></div>

  <div class="card average">
    <div class="average-title">🏆 Средний игрок</div>

    <div class="average-row">
      <span>Учёба</span>
      <span class="average-level">Ур. 5</span>
    </div>

    <div class="average-row">
      <span>Английский</span>
      <span class="average-level">Ур. 4</span>
    </div>

    <div class="average-row">
      <span>Программирование</span>
      <span class="average-level">Ур. 2</span>
    </div>

    <div class="average-row">
      <span>Активность</span>
      <span class="average-level">Ур. 6</span>
    </div>
  </div>

  <button class="reset" onclick="resetLevels()">↻ Сбросить мои уровни</button>

  <div class="footer">
    SkillUp • Level Up Your Life
  </div>

</div>

<script>

const defaultSkills = {
  "Учёба": 7,
  "Английский": 6,
  "Программирование": 4,
  "Физическая активность": 8
};

let skills = JSON.parse(localStorage.getItem("skillupLevels")) || defaultSkills;

function save() {
  localStorage.setItem("skillupLevels", JSON.stringify(skills));
}

function changeLevel(name, amount) {
  skills[name] += amount;

  if (skills[name] < 1) skills[name] = 1;
  if (skills[name] > 100) skills[name] = 100;

  save();
  render();
}

function render() {

  const container = document.getElementById("skills");
  container.innerHTML = "";

  let total = 0;

  Object.keys(skills).forEach(name => {

    const level = skills[name];
    total += level;

    const xp = (level % 10) * 10;

    container.innerHTML += `
      <div class="card">

        <div class="card-top">
          <div class="skill-name">${name}</div>
          <div class="level">LVL ${level}</div>
        </div>

        <div class="xp-text">
          Опыт до следующего уровня
        </div>

        <div class="xp-bar">
          <div class="xp-fill" style="width:${xp}%"></div>
        </div>

        <div class="buttons">
          <button class="minus" onclick="changeLevel('${name}', -1)">− Уровень</button>
          <button class="plus" onclick="changeLevel('${name}', 1)">+ Уровень</button>
        </div>

      </div>
    `;
  });

  const overall = Math.round(total / Object.keys(skills).length);
  document.getElementById("overall").textContent = overall;
}

function resetLevels() {
  skills = {...defaultSkills};
  save();
  render();
}

render();


</script>

</body>
</html>
